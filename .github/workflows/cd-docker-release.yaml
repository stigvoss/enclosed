name: Release Docker images

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:

      release_version:
        description: 'Existing release tag to publish (version only, no v prefix)'
        required: true
        type: string

      release_docker:
        description: 'Release Docker images'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  docker-release:
    name: Release Docker images
    if: ${{ github.event_name == 'push' || inputs.release_docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get release version from tag
        if: ${{ github.event_name == 'push' }}
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Get release version from input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.release_version) || github.sha }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push root Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enclosed:latest
            ghcr.io/${{ github.repository_owner }}/enclosed:${{ env.RELEASE_VERSION }}

      - name: Build and push rootless Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.rootless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enclosed:latest-rootless
            ghcr.io/${{ github.repository_owner }}/enclosed:${{ env.RELEASE_VERSION }}-rootless
